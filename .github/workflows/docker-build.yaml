name: Docker Image Build

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: swr.eu-de.otc.t-systems.com
  PROJECT: status-dashboard

permissions:
  contents: read

jobs:

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ORG: stackmon

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=ref,event=pr

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: false

  # Builds from main and manual runs land in the stackmon project (the preprod cluster's pull secret only grants access to it); a release adds a semver tag.
  publish-preprod:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ORG: stackmon

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      env:
        SWR_URL: ${{ secrets.SWR_URL }}
        SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
        SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "$SWR_URL" ] || [ -z "$SWR_USERNAME" ] || [ -z "$SWR_PASSWORD" ]; then
          echo "The SWR_URL, SWR_USERNAME and SWR_PASSWORD organization secrets must be set" >&2
          exit 1
        fi

        printf '%s' "$SWR_PASSWORD" | docker login "$SWR_URL" --username "$SWR_USERNAME" --password-stdin

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # SWR rejects the OCI image index and attestation manifests that BuildKit adds by default.
        provenance: false
        sbom: false
        push: true

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      ORG: stackmon

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=semver,pattern=v{{version}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      env:
        SWR_URL: ${{ secrets.SWR_URL }}
        SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
        SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "$SWR_URL" ] || [ -z "$SWR_USERNAME" ] || [ -z "$SWR_PASSWORD" ]; then
          echo "The SWR_URL, SWR_USERNAME and SWR_PASSWORD organization secrets must be set" >&2
          exit 1
        fi

        printf '%s' "$SWR_PASSWORD" | docker login "$SWR_URL" --username "$SWR_USERNAME" --password-stdin

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # SWR rejects the OCI image index and attestation manifests that BuildKit adds by default.
        provenance: false
        sbom: false
        push: true
