name: Docker Image Build

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: swr.eu-de.otc.t-systems.com
  PROJECT: status-dashboard
  # OTC project of the region, listed under "My Credentials > API Credentials" in the OTC console.
  SWR_PROJECT: eu-de

permissions:
  contents: read

jobs:

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ORG: stackmon

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=ref,event=pr

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: false

  # Builds from main and manual runs land in the stackmon project (the preprod cluster's pull secret only grants access to it); a release adds a semver tag.
  publish-preprod:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ORG: stackmon

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      env:
        SWR_AK: ${{ secrets.SWR_AK }}
        SWR_SK: ${{ secrets.SWR_SK }}
      run: |
        set -euo pipefail

        if [ -z "$SWR_AK" ] || [ -z "$SWR_SK" ]; then
          echo "The SWR_AK and SWR_SK repository secrets must be set" >&2
          exit 1
        fi

        # SWR rejects a raw SK, so the password has to be the login key derived
        # from the AK/SK pair, with the username in "<region>@<AK>" form. The
        # organization secrets SWR_URL/SWR_USERNAME/SWR_PASSWORD hold a
        # correctly shaped but dead credential: on 2026-09-24 every login
        # combination, including the endpoint for the region named in the
        # username, was denied, while this repository pair authenticates.
        login_key="$(printf '%s' "$SWR_AK" | openssl dgst -sha256 -hmac "$SWR_SK" | awk '{print $NF}')"
        if [[ ! "$login_key" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Cannot derive the SWR login key from the AK/SK pair" >&2
          exit 1
        fi

        printf '%s' "$login_key" | docker login "$REGISTRY" --username "${SWR_PROJECT}@${SWR_AK}" --password-stdin

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # SWR rejects the OCI image index and attestation manifests that BuildKit adds by default.
        provenance: false
        sbom: false
        push: true

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      ORG: stackmon

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.PROJECT }}
        tags: |
          type=semver,pattern=v{{version}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      env:
        SWR_AK: ${{ secrets.SWR_AK }}
        SWR_SK: ${{ secrets.SWR_SK }}
      run: |
        set -euo pipefail

        if [ -z "$SWR_AK" ] || [ -z "$SWR_SK" ]; then
          echo "The SWR_AK and SWR_SK repository secrets must be set" >&2
          exit 1
        fi

        # See the preprod channel above for why the organization secrets are
        # not used.
        login_key="$(printf '%s' "$SWR_AK" | openssl dgst -sha256 -hmac "$SWR_SK" | awk '{print $NF}')"
        if [[ ! "$login_key" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Cannot derive the SWR login key from the AK/SK pair" >&2
          exit 1
        fi

        printf '%s' "$login_key" | docker login "$REGISTRY" --username "${SWR_PROJECT}@${SWR_AK}" --password-stdin

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # SWR rejects the OCI image index and attestation manifests that BuildKit adds by default.
        provenance: false
        sbom: false
        push: true
