services:
  database:
    container_name: database
    image: postgres:15.8
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=status_dashboard
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

# Identity is provided by the external Zitadel instance
# (SD_OIDC_ISSUER / SD_OIDC_CLIENT_ID); no local IdP container is started.

volumes:
  db:
