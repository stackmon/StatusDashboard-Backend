services:
  database:
    container_name: database
    image: postgres:15.8
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=status_dashboard
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

# No identity provider container: authentication uses the external Zitadel
# instance configured by SD_OIDC_ISSUER.

volumes:
  db:
